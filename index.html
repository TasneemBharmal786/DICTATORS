    const INACTIVITY_TIMEOUT_MS = 15 * 60 * 1000; // 15 minutes
    let lastActivityTimestamp = Date.now();
    let inactivityInterval = null;

    function resetActivity() {
      lastActivityTimestamp = Date.now();
      const warningBanner = document.getElementById('inactivity-warning-banner');
      if (warningBanner) warningBanner.classList.add('hidden');
    }

    // Bind common user interaction events
    ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt => {
      window.addEventListener(evt, resetActivity, { passive: true });
    });

    // Inactivity heartbeat checker
    function startInactivityMonitor() {
      if (inactivityInterval) clearInterval(inactivityInterval);
      inactivityInterval = setInterval(() => {
        if (currentRoute === 'STUDENT_DASHBOARD' || currentRoute === 'ADMIN_DASHBOARD') {
          const idleTime = Date.now() - lastActivityTimestamp;
          const warningBanner = document.getElementById('inactivity-warning-banner');
          const countdownSpan = document.getElementById('inactivity-countdown');

          // Show 60s warning when 14 minutes idle
          if (idleTime >= INACTIVITY_TIMEOUT_MS - 60000 && idleTime < INACTIVITY_TIMEOUT_MS) {
            const secondsLeft = Math.max(1, Math.round((INACTIVITY_TIMEOUT_MS - idleTime) / 1000));
            if (warningBanner && countdownSpan) {
              warningBanner.classList.remove('hidden');
              countdownSpan.innerText = secondsLeft;
            }
          }

          // Full 15-minute timeout reached
          if (idleTime >= INACTIVITY_TIMEOUT_MS) {
            triggerInactivityLogout();
          }
        }
      }, 2000);
    }

    function triggerInactivityLogout() {
      const warningBanner = document.getElementById('inactivity-warning-banner');
      if (warningBanner) warningBanner.classList.add('hidden');

      const wasAdmin = (currentRoute === 'ADMIN_DASHBOARD');
      currentRoute = wasAdmin ? 'ADMIN_LOGIN' : 'STUDENT_LOGIN';
      loginErrorMessage = 'You have been automatically logged out due to 15 minutes of inactivity for institutional security.';
      renderApp();
      showToast('[Alert] Session timed out due to 15 min inactivity.');
    }

    // ==========================================
    // 14. DIAGNOSTIC & PRESCRIPTIVE IMPROVEMENT ENGINE
    // ==========================================
    function generateStudentImprovementAnalysis(student) {
      const salutation = (student.gender === 'Female') ? 'Miss.' : (student.gender === 'Male' ? 'Mr.' : 'miss/mr.');
      
      const weaknesses = [];
      const actionPoints = [];

      // 1. Backlogs
      if (student.academic.activeBacklogs > 0) {
        weaknesses.push(`[Alert] **Active Backlogs (${student.academic.activeBacklogs} Standing Arrears):** Uncleared subjects drag down your Academic Pillar and will block eligibility for Tier-1 campus placement drives.`);
        actionPoints.push(` **Dedicated Backlog Remedial Sprint:** Allocate a non-negotiable **90-minute daily revision block** exclusively to clearing these arrear subjects. Attend the Saturday remedial tutorials in the department library block.`);
      }

      // 2. CGPA
      if (student.academic.cgpa < 7.5) {
        weaknesses.push(`[Alert] **CGPA Deficit (${student.academic.cgpa} / 10.0):** Your cumulative GPA is currently below the 7.50 benchmark required for top tech placements (Amazon, Microsoft, Cisco).`);
        actionPoints.push(`↑ **Target 42+/50 in Continuous Internal Evaluations (CIE):** Focus on past 5 years of university exam question papers to guarantee high internal marks and elevate your overall CGPA above 7.5.`);
      }

      // 3. Attendance
      if (student.attendance.overallPercentage < 75) {
        weaknesses.push(`[Critical Alert] **Critical Attendance Deficit (${student.attendance.overallPercentage}%):** You are breaching the mandatory university 75% attendance threshold and at risk of examination debarment and hall ticket withholding.`);
        actionPoints.push(` **Mandatory Class Attendance Recovery:** You must attend the next **15 consecutive lectures without absence** to recover above 75%. If your absences were medical, submit doctor slips to Dean Dr. Sharma within 3 days for condonation approval.`);
      } else if (student.attendance.overallPercentage < 80) {
        weaknesses.push(`[Alert] **Borderline Classroom Attendance (${student.attendance.overallPercentage}%):** Hovering just barely above the 75% cutoff with zero buffer for contingencies.`);
        actionPoints.push(`⏰ **Stabilize Class Attendance:** Maintain at least 85% attendance across all subjects over the next 3 weeks to create a safe cushion before semester end exams.`);
      }

      // 4. LMS & Digital Learning Engagement
      if (student.lms.assignmentCompletionRate < 80 || student.lms.weeklyLogins < 5) {
        weaknesses.push(`[Alert] **LMS & Lab Assignment Deficit (${student.lms.assignmentCompletionRate}% completion, ${student.lms.weeklyLogins} logins/week):** Late lab reports and irregular LMS portal activity are lowering your Continuous Assessment score.`);
        actionPoints.push(` **Clear Overdue LMS Submissions:** Complete and upload all pending assignments before Friday midnight. Log in at least 5 times a week to review uploaded lecture slides.`);
      }

      // 5. Placement & Algorithmic Coding
      if (student.placement.codingScore < 70) {
        weaknesses.push(`[Alert] **Algorithmic Coding Gap (${student.placement.codingScore}/100):** Falls short of the 70-point benchmark needed to pass initial technical screening tests for software engineering roles.`);
        actionPoints.push(` **Daily LeetCode / Coding Sprint:** Practice 2 Data Structures problems daily (Focus on Arrays, HashMaps, Binary Trees, and Two Pointers) to raise your coding score past 75.`);
      }

      // 6. Mock Interviews & Communication
      if (student.placement.mockInterviewRating < 70) {
        weaknesses.push(`[Alert] **Mock Interview Performance (${student.placement.mockInterviewRating}/100):** Communication clarity, system breakdown, and behavioral answers need improvement.`);
        actionPoints.push(` **Alumni Mock Interview Preparation:** Practice the STAR method (Situation, Task, Action, Result) for behavioral questions and practice dry-running algorithms on paper.`);
      }

      // Negative XAI Drivers
      const negDrivers = student.xaiDrivers ? student.xaiDrivers.filter(d => d.type === 'NEGATIVE') : [];
      negDrivers.forEach(d => {
        if (!weaknesses.some(w => w.includes(d.feature))) {
          weaknesses.push(`[Alert] **${d.feature} (${d.impact} pts):** ${d.desc}`);
        }
      });

      // Prescriptive Actions
      if (student.actions && student.actions.length > 0) {
        student.actions.forEach(a => {
          if (!actionPoints.some(ap => ap.includes(a.title))) {
            actionPoints.push(` **${a.title} (+${a.impact} pts):** ${a.desc}`);
          }
        });
      }

      // Top Performer fallback
      if (weaknesses.length === 0) {
        weaknesses.push(`[Excellence] **Outstanding Academic Foundation:** You have strong performance across all pillars (CGPA: ${student.academic.cgpa}, Attendance: ${student.attendance.overallPercentage}%, Coding: ${student.placement.codingScore}/100, Success Score: ${student.successScore.overall}/100).`);
        actionPoints.push(`[Action] **Prepare for Super Dream Tech Roles (24+ LPA):** Build advanced distributed systems, contribute to open source repositories, and mentor peers in university coding clubs.`);
      }

      // Physical / Sports balance
      actionPoints.push(` **Maintain Sports & Physical Conditioning:** Continue your **${student.sports.weeklyHours}h/week** in **${student.sports.primarySport}** to reduce mental burnout and sustain stamina for 4-hour placement marathons.`);

      let reply = `###  Academic Diagnostic & Self-Improvement Plan for ${salutation} ${student.name}\n\n`;
      reply += `I have evaluated your live records across all institutional pillars (Success Score: **${student.successScore.overall}/100**, Risk Level: **${student.risk.academicRisk} Academic / ${student.risk.placementRisk} Placement**). Here is exactly where you are lacking and the specific points you should execute to improve:\n\n`;
      
      reply += `#### <svg class="w-4 h-4 text-rose-600 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg> Where You Are Currently Lacking in Studies:\n`;
      weaknesses.forEach((w, idx) => {
        reply += `${idx + 1}. ${w}\n`;
      });

      reply += `\n---\n\n#### [Action] Action Points to Improve Yourself:\n`;
      actionPoints.forEach((a, idx) => {
        reply += `${idx + 1}. ${a}\n`;
      });

      return reply;
    }

          } else {
            reply = `Regarding your university query, **${student.name}**:\n• As your Campus Pulse mentor, I recommend reviewing the latest department circular on the college LMS portal and consulting with your designated faculty advisor.\n• Feel free to ask more specific questions about engineering subject concepts, university attendance rules, backlog clearance, or placement cutoffs!`;
          }
        }

        chatMessages.push({ sender: 'bot', text: reply });
        renderAiBot();
      }, 400);
    }

    function formatBotText(str) {
      return str
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\`(.*?)\`/g, '<code class="bg-rose-50 px-1 py-0.5 rounded text-rose-700 font-mono border border-rose-200">$1</code>')
        .replace(/\n/g, '<br/>');
    }

    // ==========================================
    // 15. CONTROLLER & CREDENTIAL HANDLERS
    // ==========================================
    function autofillStudent(usn) {
      document.getElementById('student-usn').value = usn;
      document.getElementById('student-pwd').value = 'password123';
      resetActivity();
    }

    function handleStudentLogin(e) {
      e.preventDefault();
      resetActivity();
      const usnInput = document.getElementById('student-usn').value.trim().toUpperCase();
      const found = students.find(s => s.usn.toUpperCase() === usnInput);

      if (!found) {
        loginErrorMessage = `No student record found for USN "${usnInput}". Please check your USN or register.`;
        renderApp();
        return;
      }

      loginErrorMessage = '';
      activeStudentId = found.id;
      initChatForStudent(found);
      navigateTo('STUDENT_DASHBOARD');
      showToast(`Welcome back, ${found.name}! Signed in to Campus Pulse.`);
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      resetActivity();
      const emailInput = document.getElementById('admin-email').value.trim().toLowerCase();
      const pwdInput = document.getElementById('admin-pwd').value.trim();

      if (emailInput !== 'dean.academics@rvce.edu.in' || pwdInput !== 'admin123') {
        loginErrorMessage = 'Invalid faculty credentials. Access denied.';
        renderApp();
        return;
      }

      loginErrorMessage = '';
      navigateTo('ADMIN_DASHBOARD');
      showToast("Access Authorized: Dean Dr. Sharma Console Active.");
    }

    function approveStudent(id) {
      resetActivity();
      students = students.map(s => s.id === id ? { ...s, approvalStatus: 'APPROVED' } : s);
      renderApp();
      showToast("Account Approved! Student portal unlocked.");
    }

    function rejectStudent(id) {
      resetActivity();
      students = students.map(s => s.id === id ? { ...s, approvalStatus: 'REJECTED' } : s);
      renderApp();
      showToast("Account access rejected.");
    }

    function handleSearch(val) {
      resetActivity();
      searchQuery = val;
      renderApp();
    }

    function handleRegistration(e) {
      e.preventDefault();
      resetActivity();
      const name = document.getElementById('reg-name').value.trim();
      const usn = document.getElementById('reg-usn').value.trim().toUpperCase();
      const sem = document.getElementById('reg-sem').value;
      const dept = document.getElementById('reg-dept').value;
      const pwd = document.getElementById('reg-pwd').value;

      if (students.some(s => s.usn.toUpperCase() === usn)) {
        loginErrorMessage = `An account with USN "${usn}" already exists.`;
        renderApp();
        return;
      }

      const newId = 'stu-' + Date.now();
      const newStu = {
        id: newId,
        usn: usn,
        password: pwd,
        name: name,
        gender: 'Male',
        avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80',
        approvalStatus: 'PENDING',
        requestedAt: 'Just now',
        sports: { primarySport: 'Football & Athletic Track', weeklyHours: 4, fitnessLevel: 'Active', staminaNeed: 'High' },
        academic: { department: dept, semester: Number(sem), cgpa: 7.6, cgpaDelta: '↑ Baseline', cgpaTrend: 'UP', activeBacklogs: 0 },
        attendance: { overallPercentage: 80, attendanceDelta: '↑ Baseline', attendanceTrend: 'UP' },
        lms: { weeklyLogins: 5, assignmentCompletionRate: 80, lmsDelta: '↑ Baseline', lmsTrend: 'UP' },
        placement: { codingScore: 65, codingDelta: '↑ Baseline', codingTrend: 'UP', aptitudeScore: 70, mockInterviewRating: 68, placementDriveEligible: false },
        skills: { technicalIndex: 70, softSkillsRating: 4.0, competencies: ['Core Programming', 'Web Basics'] },
        facultyFeedback: { sentiment: 'NEUTRAL', advisorName: 'Proctorial Cell', recentNote: 'Pending onboarding interview with department proctor.', date: 'Just now' },
        successScore: { overall: 70 },
        risk: { academicRisk: 'LOW', placementRisk: 'LOW', primaryRiskReason: 'Newly registered, awaiting faculty verification.' },
        cohort: { label: 'Newly Registered', badgeColor: 'bg-rose-50 text-rose-700 border-rose-200' },
        xaiDrivers: [
          { feature: 'New Registration Submitted', impact: 10, type: 'POSITIVE', desc: 'Academic records ingested.' },
          { feature: 'Pending Verification Hold', impact: -5, type: 'NEGATIVE', desc: 'Awaiting Dean authorization.' }
        ],
        actions: [
          { title: 'Faculty Verification', desc: 'Awaiting mentor credential sign-off.', impact: 5 }
        ]
      };

      students.unshift(newStu);
      activeStudentId = newId;
      initChatForStudent(newStu);
      loginErrorMessage = '';
      navigateTo('STUDENT_DASHBOARD');
      showToast(`Account registered for ${name}! Security status: PENDING.`);
    }

    // INITIAL LAUNCH: RENDER STUDENT LOGIN SCREEN FIRST & START INACTIVITY MONITOR
    renderApp();
    startInactivityMonitor();
  </script>
</body>
</html>
